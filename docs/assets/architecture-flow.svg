<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="ar-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="ar-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#111827">SwiftAgentX · Tiered Execution</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Resolve at the shallowest tier that can — skip the LLM when you don't need it</text>
  <rect x="270" y="76" width="180" height="42" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360.0" y="95.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">User Request</text>
  <line x1="360" y1="118" x2="360" y2="148" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <rect x="230" y="148" width="260" height="58" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360.0" y="175.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">① Pipeline short-circuit</text>
  <text x="360.0" y="193.0" text-anchor="middle" font-size="11" fill="#6b7280">KB exact · security · feature flags</text>
  <line x1="490" y1="177" x2="612" y2="177" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ar-g)"/>
  <rect x="540" y="166" width="44" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="562" y="178" text-anchor="middle" font-size="10" fill="#16a34a">hit</text>
  <rect x="614" y="159" width="300" height="36" rx="18.0" ry="18.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="764.0" y="181.0" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">0 LLM · sub-ms  →  Answer</text>
  <text x="372" y="226" font-size="10" fill="#9ca3af">miss</text>
  <line x1="360" y1="206" x2="360" y2="238" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <rect x="230" y="238" width="260" height="58" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360.0" y="265.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">② Cache (3-level)</text>
  <text x="360.0" y="283.0" text-anchor="middle" font-size="11" fill="#6b7280">KB global · tool per-user · session</text>
  <line x1="490" y1="267" x2="612" y2="267" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ar-g)"/>
  <rect x="540" y="256" width="44" height="16" rx="3" fill="#ffffff" opacity="0.95"/>
  <text x="562" y="268" text-anchor="middle" font-size="10" fill="#16a34a">hit</text>
  <rect x="614" y="249" width="300" height="36" rx="18.0" ry="18.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="764.0" y="271.0" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">0 LLM  →  Answer</text>
  <text x="372" y="316" font-size="10" fill="#9ca3af">miss</text>
  <line x1="360" y1="296" x2="360" y2="328" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar-gray)"/>
  <rect x="230" y="328" width="260" height="58" rx="8" ry="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="360.0" y="355.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">③ Intent classification</text>
  <text x="360.0" y="373.0" text-anchor="middle" font-size="11" fill="#6b7280">LIGHT model · qwen-flash · ~200ms</text>
  <path d="M 360,386 C 360,425 180.0,420 180.0,456" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#ar-g)"/>
  <rect x="60" y="458" width="240" height="64" rx="8" ry="8" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="180.0" y="488.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Scenario</text>
  <text x="180.0" y="506.0" text-anchor="middle" font-size="11" fill="#6b7280">pre-compiled tool chain</text>
  <rect x="100.0" y="540" width="160" height="30" rx="15.0" ry="15.0" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="180.0" y="559.0" text-anchor="middle" font-size="12" font-weight="600" fill="#0d9488">1 LLM · ~0.5s</text>
  <line x1="180.0" y1="570" x2="500" y2="626" stroke="#0d9488" stroke-width="1.4" marker-end="url(#ar-g)"/>
  <path d="M 360,386 C 360,425 500.0,420 500.0,456" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ar-o)"/>
  <rect x="380" y="458" width="240" height="64" rx="8" ry="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="500.0" y="488.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Direct answer</text>
  <text x="500.0" y="506.0" text-anchor="middle" font-size="11" fill="#6b7280">HEAVY model</text>
  <rect x="420.0" y="540" width="160" height="30" rx="15.0" ry="15.0" fill="#fed7aa" stroke="#fb923c" stroke-width="1.2"/>
  <text x="500.0" y="559.0" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">2 LLM · ~1.4s</text>
  <line x1="500.0" y1="570" x2="500" y2="626" stroke="#ea580c" stroke-width="1.4" marker-end="url(#ar-o)"/>
  <path d="M 360,386 C 360,425 820.0,420 820.0,456" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar-r)"/>
  <rect x="700" y="458" width="240" height="64" rx="8" ry="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="820.0" y="488.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">ReAct loop</text>
  <text x="820.0" y="506.0" text-anchor="middle" font-size="11" fill="#6b7280">thought → action → observation</text>
  <rect x="740.0" y="540" width="160" height="30" rx="15.0" ry="15.0" fill="#fecaca" stroke="#f87171" stroke-width="1.2"/>
  <text x="820.0" y="559.0" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">3 LLM · ~3.1s</text>
  <line x1="820.0" y1="570" x2="500" y2="626" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ar-r)"/>
  <path d="M 940,474 C 972,484 972,512 940,512" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#ar-r)"/>
  <text x="978" y="496" text-anchor="middle" font-size="10" fill="#dc2626" transform="rotate(90 978 496)">loop</text>
  <rect x="400" y="628" width="200" height="46" rx="8" ry="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="500.0" y="649.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Answer</text>
  <text x="500" y="712" text-anchor="middle" font-size="12" fill="#6b7280">shallower (green) = 0–1 LLM calls, sub-second  →  deeper (orange/red) = full reasoning, higher cost &amp; latency</text>
</svg>
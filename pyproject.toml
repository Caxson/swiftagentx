[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swiftagentx"
version = "0.2.0"
description = "Production-grade Agent framework with sub-second latency via tiered execution: three-level cache, dual-model routing, and scenario toolchains."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Caxson", email = "caelumsilas0@gmail.com" },
]
keywords = [
    "agent", "llm", "react", "sse", "streaming", "toolchain",
    "ai-agent", "agent-framework", "openai", "rag", "low-latency",
    "production-ready", "scenario-routing", "knowledge-base",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["httpx>=0.25.0"]
dashscope = ["dashscope>=1.13.0"]
flask = ["Flask>=2.0.0"]
fastapi = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
mysql = ["PyMySQL>=1.1.0"]
all = ["swiftagentx[openai,dashscope,flask,fastapi,mysql]"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
]
benchmark = [
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Caxson/swiftagentx"
Documentation = "https://github.com/Caxson/swiftagentx/tree/main/docs"
Repository = "https://github.com/Caxson/swiftagentx"
Issues = "https://github.com/Caxson/swiftagentx/issues"
Changelog = "https://github.com/Caxson/swiftagentx/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/swiftagentx"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
